# Local corpus commands need no AWS credentials, Docker, or paid requests.
opensearch_url = "http://localhost:9200"

[chunking]
strategy = "fixed"
size = 500
overlap = 75
counting_method = "whitespace-estimate"
preprocessing_version = "raw-v1"

[retrieval]
candidate_count = 20
context_passages = 5
context_budget = 4000
rrf_constant = 60

[models]
embedding_model_id = "amazon.titan-embed-text-v2:0"
embedding_dimensions = 1024
normalize = true
# generation_model_id must be selected after checking Bedrock access/pricing.

[cloud]
region = "us-east-1"
# profile, artifact_bucket, and development_model_budget_usd are unset.

[embedding]
cache_path = "data/cache/embeddings.sqlite3"
concurrency = 2
max_requests_per_run = 500

[index]
name = "s3-rag-active"

[api]
allowed_origins = ["http://localhost:3000", "http://127.0.0.1:3000"]
max_concurrent_searches = 4
requests_per_minute = 30
